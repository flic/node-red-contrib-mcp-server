<script type="text/html" data-template-name="mcp-in">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-mcpServer"><i class="fa fa-server"></i> MCP Server</label>
        <input type="text" id="node-input-mcpServer">
    </div>
    <div class="form-row">
        <label for="node-input-toolName"><i class="fa fa-terminal"></i> Tool name</label>
        <input type="text" id="node-input-toolName" placeholder="my_tool" style="width:calc(100% - 105px)">
    </div>
    <div class="form-row">
        <label for="node-input-description"><i class="fa fa-comment"></i> Description</label>
        <textarea id="node-input-description" rows="3" style="width:calc(100% - 105px);" placeholder="Describe what this tool does so the model knows when to use it."></textarea>
    </div>
    <div class="form-row">
        <label for="node-input-inputSchema" style="vertical-align:top; margin-top:4px"><i class="fa fa-code"></i> Parameters</label>
        <textarea id="node-input-inputSchema" rows="8" style="width:calc(100% - 105px); font-family:monospace; font-size:12px;"></textarea>
    </div>
    <div class="form-row">
        <label for="node-input-topic"><i class="fa fa-tag"></i> msg.topic</label>
        <input type="text" id="node-input-topic" placeholder="(defaults to tool name)" style="width:calc(100% - 105px)">
    </div>
    <div class="form-row">
        <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout</label>
        <input type="number" id="node-input-timeout" style="width:80px" min="1" value="30"> seconds
    </div>
    <hr style="margin:12px 0">

    <div class="form-row">
        <label for="node-input-requiredValue"><i class="fa fa-check"></i> Tool access</label>
        <input type="text" id="node-input-requiredValue" placeholder="(empty = no extra restriction)" style="width:calc(100% - 105px)">
    </div>
    <div class="form-tips" style="margin-left:105px; margin-bottom:8px;">
        <small>Per-tool access gate. Comma-separated values of the MCP Server node's <b>Access claim</b> (<span id="mcp-in-claim-name"><code>groups</code></span>) — the caller's claim must contain <b>at least one</b> of them for this tool to be listed or callable. Applied <b>on top of</b> that server's own <b>Server access</b> list, not instead of it: callers must clear both.</small>
    </div>

    <hr style="margin:12px 0">

    <div class="form-row">
        <label for="node-input-exposeClaims" style="width:auto"><i class="fa fa-id-card-o"></i> Expose JWT claims</label>
        <input type="checkbox" id="node-input-exposeClaims" style="width:23px; margin:0">
        <label for="node-input-exposeClaims" style="margin:0; width:auto;"> Set msg.jwtClaims with the verified JWT payload</label>
    </div>
    <div class="form-tips" style="margin-left:105px;">
        <small>Claims may contain email, sub, groups, etc. — treat as sensitive data and avoid careless logging.</small>
    </div>
</script>

<script type="text/html" data-help-name="mcp-in">
    <p>Defines one MCP tool. When an MCP client calls it, this node fires a message out of
    its single output — there's nothing to wire into it, it's a call trigger, not a regular
    flow step.</p>
    <p>The output message carries:</p>
    <ul>
        <li><code>msg.payload</code> — the tool call arguments, shaped by <b>Parameters</b> below.
        <b>Treat this as untrusted input</b>: the JSON schema documents the shape for the model
        but nothing enforces it — the caller can send any names, types and values. Validate and
        escape in the flow before using arguments in shell commands, file paths, URLs or queries
        (see the example flows' use of <code>encodeURIComponent</code>).</li>
        <li><code>msg._mcpCallId</code> — an opaque id identifying this specific call.</li>
        <li><code>msg.topic</code> — set to the <b>msg.topic</b> field below, or the tool name if left blank.</li>
        <li><code>msg.jwtClaims</code> — the caller's verified JWT claims, only when <b>Expose JWT claims</b> is on.</li>
    </ul>
    <p>Wire the rest of the flow to do the actual work, then finish with an <code>mcp-out</code>
    node pointed at the <em>same</em> MCP Server. <code>msg._mcpCallId</code> must reach that
    <code>mcp-out</code> unchanged — if a function node rebuilds <code>msg</code> from scratch
    instead of mutating/returning the original, carry this property over explicitly, or the
    call can never be resolved and the caller sees a timeout.</p>
    <p>Only wire one <code>mcp-out</code> to eventually receive each call — the first message
    that arrives with a given <code>_mcpCallId</code> resolves the call; any later one for the
    same id is silently dropped.</p>
    <p><b>Tool name</b> must be unique among the tools on the same MCP Server; it's the literal
    name the model calls. <b>Description</b> is shown to the model and is the main signal it
    uses to decide when to invoke this tool — be specific about what it does and when to use
    it. <b>Parameters</b> is a JSON-Schema object describing the call arguments (becomes
    <code>msg.payload</code>'s shape). <b>Timeout</b> is how long the flow has to reach an
    <code>mcp-out</code> before the client is told the call timed out.</p>
    <p><b>Tool access</b> gates this one tool. Leave it empty and the tool is reachable by anyone
    who clears the MCP Server node's own <b>Server access</b> gate; set a comma-separated list and
    the caller's claim must additionally contain at least one of those values. The claim
    <em>name</em> is configured once, as <b>Access claim</b> on the MCP Server node. Callers who
    don't qualify never see the tool — it is absent from <code>tools/list</code> and from the
    server's <code>initialize</code> instructions — and a direct call is refused with an
    explanatory message.</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('mcp-in', {
        category: 'MCP',
        color: '#b3b3ff',
        defaults  : {
            name         : { value: '' },
            mcpServer    : { value: '', type: 'mcp-server', required: true },
            toolName     : { value: '', required: true },
            description  : { value: '' },
            inputSchema  : { value: '' },
            topic        : { value: '' },
            timeout      : { value: 30 },
            requiredValue: { value: '' },
            exposeClaims : { value: false }
        },
        inputs    : 0,
        outputs   : 1,
        icon      : 'font-awesome/fa-sign-out',
        paletteLabel: 'MCP In',
        label     : function () { return this.name || this.toolName || 'MCP In'; },
        oneditprepare: function () {
            // Show the selected server's actual claim name in the Tool access tip — the values
            // typed here are values *of that claim*, and it is configured on a different node.
            function updateClaimName() {
                var server = RED.nodes.node($('#node-input-mcpServer').val());
                var claim  = (server && server.requiredClaim) || 'groups';
                $('#mcp-in-claim-name').html($('<code>').text(claim));
            }
            $('#node-input-mcpServer').on('change', updateClaimName);
            updateClaimName();

            if (!this.inputSchema) {
                $('#node-input-inputSchema').val(JSON.stringify({
                    type: 'object',
                    properties: {
                        param1: { type: 'string', description: 'Description of param1' }
                    }
                }, null, 2));
            }
        },
        oneditsave: function () {
            var schema = $('#node-input-inputSchema').val();
            if (schema) {
                try { JSON.parse(schema); }
                catch (e) { RED.notify('Parameters JSON is invalid: ' + e.message, 'error'); }
            }
        }
    });
</script>
